kind = "web"
previewPath = "/"
title = "BIRU MENARA"
version = "1.0.0"
id = "artifacts/biru-menara"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/biru-menara run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biru-menara", "run", "build" ]
serve = "static"
publicDir = "artifacts/biru-menara/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
